\Preamble{xhtml,mathjax,3,next,charset=utf-8}
\Configure{@HEAD}{\HCode{<link rel="stylesheet" href="style.css" />}}
\begin{document}
% tex4ht passes numbered environments to MathJax registering only their first
% \label (and none in subequations), and doesn't register flalign at all due to
% a typo (\VerbMath{flalign[equation]}). They are redefined to register every
% \label; labels point at the environment's anchor and web/crossrefs.js fixes
% each one's number.
\ExplSyntaxOn
\cs_generate_variant:Nn \regex_extract_all:nnN {nV}
\cs_new_protected:Npn \book_verbmath:n #1 {
  \RenewDocumentEnvironment{#1}{+!b}{
    \NoFonts\expandafter\VerbMathToks\expandafter{\detokenize{##1}}{#1}\EndNoFonts
    \refstepcounter{equation}
    \tl_set:Nx \l_tmpa_tl {\detokenize{##1}}
    \regex_extract_all:nVN {\\label\s*\{\K[^\}]*} \l_tmpa_tl \l_tmpa_seq
    \seq_map_inline:Nn \l_tmpa_seq {\label{####1}}
  }{}
}
\clist_map_inline:nn {equation,align,alignat,flalign,gather,multline,subequations} {\book_verbmath:n{#1}}
\ExplSyntaxOff
\EndPreamble
